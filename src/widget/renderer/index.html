<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>taskboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <h1>任务</h1>
    <div id="strip" hidden></div>
    <button type="button" id="toggle-archive" class="text" title="最近 7 天完成的任务">归档</button>
    <button type="button" id="organize" class="text" title="从最近的对话里整理任务">整理</button>
    <button type="button" id="add-task" class="icon" aria-label="添加任务" title="添加任务"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button type="button" id="toggle-compact" class="icon" aria-label="收起为窄栏" title="收起为窄栏"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 10l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button type="button" id="hide-window" class="icon" aria-label="隐藏窗口" title="隐藏窗口（点托盘图标恢复）"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 8h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div id="strip-fill" aria-hidden="true"></div>
  </header>
  <div id="notice" role="alert" hidden></div>
  <div id="undo" role="status" hidden><span id="undo-text"></span><button type="button" id="undo-button" class="btn small">撤销</button></div>
  <div id="status" class="visually-hidden" role="status"></div>
  <main id="content"></main>
  <script src="renderer.js"></script>
</body>
</html>
